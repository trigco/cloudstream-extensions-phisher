name: XFlixBD Extension Build

on:
  pull_request:
    paths:
      - 'XFlixBD/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/xflixbd-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-xflixbd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties for repository modules
        run: touch local.properties

      - name: Build XFlixBD plugin
        run: |
          chmod +x gradlew
          ./gradlew :XFlixBD:build --stacktrace
          echo "Built outputs:"
          find XFlixBD/build -type f | sort | grep -E '\.(cs3|jar)$' || true
          mkdir -p dist
          find XFlixBD/build -type f \( -name '*.cs3' -o -name '*.jar' \) -exec cp {} dist/ \;
          if [ -z "$(find dist -type f -print -quit)" ]; then
            echo "No plugin package found after Gradle build."
            exit 1
          fi

      - name: Upload XFlixBD plugin package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xflixbd-cloudstream-plugin
          path: dist/*
          if-no-files-found: error

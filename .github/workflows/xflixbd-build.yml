name: XFlixBD Extension Build

on:
  pull_request:
    paths:
      - 'XFlixBD/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/xflixbd-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-xflixbd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extension source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Create isolated CloudStream build workspace
        run: |
          mkdir -p workspace
          cp -a source/gradle workspace/
          cp source/gradlew source/build.gradle.kts source/settings.gradle.kts source/gradle.properties workspace/
          cp -a source/XFlixBD workspace/
          # Preserve CloudStream's build plugin and repository configuration,
          # but exclude unrelated providers that can have independent failures.
          cat > workspace/settings.gradle.kts <<'EOF'
          rootProject.name = "CloudstreamPlugins"
          include("XFlixBD")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: touch workspace/local.properties

      - name: Build and package XFlixBD plugin
        working-directory: workspace
        run: |
          chmod +x gradlew
          ./gradlew :XFlixBD:build --stacktrace
          echo "Compiled plugin contents:"
          find XFlixBD/build -type f | sort | grep -E '\.(jar|cs3)$' || true
          mkdir -p dist
          find XFlixBD/build -type f -name '*.jar' ! -name '*-sources.jar' -exec cp {} dist/ \;
          test -s dist/full.jar

      - name: Package plugin payload
        working-directory: workspace
        run: |
          mkdir -p release
          cp XFlixBD/build/libs/*.jar release/ 2>/dev/null || true
          find XFlixBD/build -type f -name 'full.jar' -exec cp {} release/XFlixBD-full.jar \;
          if [ -z "$(find release -type f -print -quit)" ]; then
            echo "No compiled XFlixBD plugin output found."
            exit 1
          fi
          (cd release && zip -q XFlixBD-extension.zip *)

      - name: Upload XFlixBD compiled output
        uses: actions/upload-artifact@v4
        with:
          name: xflixbd-cloudstream-plugin
          path: workspace/release/XFlixBD-extension.zip
          if-no-files-found: error

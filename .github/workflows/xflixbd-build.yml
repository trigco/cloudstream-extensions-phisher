name: XFlixBD Extension Build

on:
  pull_request:
    paths:
      - 'XFlixBD/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/xflixbd-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-xflixbd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build XFlixBD plugin
        run: |
          chmod +x gradlew
          ./gradlew :XFlixBD:build --stacktrace

      - name: Upload plugin package if generated
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xflixbd-cloudstream-plugin
          path: |
            XFlixBD/build/*.cs3
            XFlixBD/build/*.jar
          if-no-files-found: warn

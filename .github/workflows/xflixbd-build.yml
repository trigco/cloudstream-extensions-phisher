name: XFlixBD Extension Build

on:
  pull_request:
    paths:
      - 'XFlixBD/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/xflixbd-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-xflixbd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extension source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Create isolated CloudStream build workspace
        run: |
          mkdir -p workspace
          cp -a source/gradle workspace/
          cp source/gradlew source/build.gradle.kts source/settings.gradle.kts source/gradle.properties workspace/
          cp -a source/XFlixBD workspace/
          cat > workspace/settings.gradle.kts <<'EOF'
          rootProject.name = "CloudstreamPlugins"
          include("XFlixBD")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: touch workspace/local.properties

      - name: Build CloudStream .cs3 plugin
        working-directory: workspace
        run: |
          chmod +x gradlew
          ./gradlew :XFlixBD:make --stacktrace
          echo "Generated plugin files:"
          find XFlixBD/build -type f \( -name '*.cs3' -o -name '*.jar' \) | sort
          mkdir -p release
          find XFlixBD/build -type f -name '*.cs3' -exec cp {} release/ \;
          if [ -z "$(find release -maxdepth 1 -type f -name '*.cs3' -print -quit)" ]; then
            echo "No .cs3 plugin generated. Build output:"
            find XFlixBD/build -maxdepth 5 -type f | sort
            exit 1
          fi

      - name: Upload XFlixBD .cs3 plugin
        uses: actions/upload-artifact@v4
        with:
          name: xflixbd-cs3-plugin
          path: workspace/release/*.cs3
          if-no-files-found: error

name: XFlixBD Extension Build

on:
  pull_request:
    paths:
      - 'XFlixBD/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/xflixbd-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-xflixbd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties for repository modules
        run: touch local.properties

      - name: Build and package XFlixBD plugin
        run: |
          chmod +x gradlew
          ./gradlew :XFlixBD:build makePluginsJson --stacktrace
          echo "Built CloudStream plugin outputs:"
          find XFlixBD/build build -type f | sort | grep -E '\.(cs3|jar|json)$' || true
          mkdir -p dist
          find XFlixBD/build build -type f \( -name '*.cs3' -o -name 'plugins.json' \) -exec cp {} dist/ \;
          if ! find dist -type f -name '*.cs3' -print -quit | grep -q .; then
            echo "CloudStream .cs3 package was not generated."
            exit 1
          fi

      - name: Upload XFlixBD .cs3 package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xflixbd-cloudstream-plugin
          path: dist/*
          if-no-files-found: error
